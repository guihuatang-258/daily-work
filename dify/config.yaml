# 通用 Dify 监控配置。
# 可通过环境变量 DIFY_MONITOR_CONFIG 指向其他 YAML 文件。

instance:
  name: nezha-production # 替换成你自己的dify名称
  base_url: https://nezha.cn-pgcloud.com # 替换成你自己的dify地址
  timezone: Asia/Shanghai
  workspace_id: 7bd9ea66-1c30-4483-8b1c-5a9d0d0d338d # GenCare

authentication:
  type: cookie # 可选值: cookie, authorization

collection:
  apps_page_size: 30 # 每页应用数量
  interactive_log_limit: 10 # 每页交互日志数量
  monitor_page_size: 100
  token_stats_workers: 10 # 令牌统计工作线程数

# token统计相关参数
token_statistics:
  workflow_sample_size: 20

# 应用相关参数
applications:
  groups_file: dify_flow_groups.json
  chat_modes:
    - advanced-chat
    - chat
