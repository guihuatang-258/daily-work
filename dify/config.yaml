# 通用 Dify 监控配置。
# 可通过环境变量 DIFY_MONITOR_CONFIG 指向其他 YAML 文件。

instance:
  name: nezha-production
  base_url: https://nezha.cn-pgcloud.com
  timezone: Asia/Shanghai

collection:
  apps_page_size: 30 # 每页应用数量
  interactive_log_limit: 10 # 每页交互日志数量
  token_stats_limit: 20
  monitor_page_size: 100
  token_stats_workers: 10 # 令牌统计工作线程数

# token统计相关参数
token_statistics:
  workflow_sample_size: 20

# 应用相关参数
applications:
  groups_file: dify_flow_groups.json
  chat_modes:
    - advanced-chat
    - chat
