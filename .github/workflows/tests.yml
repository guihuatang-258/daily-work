name: Tests

on:
  push:
    branches:
      - main
      - agent/**
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest

    env:
      NO_COLOR: "1"

    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.10"
          - "3.11"
          - "3.12"

    defaults:
      run:
        working-directory: dify

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: dify/requirements.txt

      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt

      - name: Prepare sanitized flow groups fixture
        run: cp tests/fixtures/dify_flow_groups.json dify_flow_groups.json

      - name: Compile Python files
        run: python -m compileall -q nezha_api tests analyze_nezha_apis.py

      - name: Run unit tests
        run: python -m unittest discover -s tests -v
